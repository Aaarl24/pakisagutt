<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ewan Ko</title>
    <link href="hindialam.css" rel="stylesheet"/>
  </head>
  <body>
      <main>
        <header>
          <h1 id="title">Pakilala Ka Nga</h1>
          <p id="description">Please sagutan muu</p>
        </header>
          <form id="survey-form">
            <div class="form-group">
              <label id="name-label" for="name">Anong pangalan tinatawag sa'yo?</label>
              <input type="text" id="name" name="name" placeholder="pangalan mo uyy" required>
          </div>
          <div class="form-group">
            <label id="name-label" for="apelyido">Anong apelyido mo?</label>
            <input type="text" id="apelyido" name="apelyido" placeholder="apelyido" required>
            <div class="form-group">
              <div class="form-group">
                <label id="name-label" for="taon">Ilang taon ka na ba?</label>
                <input type="number" id="taon" name="taon" min="1" max="120" placeholder="edad" required>
                <div class="form-group">
              <p>Crush mo ba ako??</p>
              <label>
                  <input type="radio" name="preference" value="YESSSS!!!" required> <!-- Changed option values to actual answers -->
                  YESSSS!!!
              </label>
              <label>
                  <input type="radio" name="preference" value="no"> <!-- Changed option values to actual answers -->
                  no
              </label>
          </div>
            <div id="mukha">
              <label for="profile-picture">Pakita Mo Kung Sino Ka</label> 
              <input id="profile-picture" type="file" name="file" />
            </div>
            <p></p>
            <div class="form-group">
              <p>Miss mo na ba ako??</p>
              <label>
                  <input type="checkbox" name="checkbox" value="YES"> <!-- Updated checkbox values for actual answers -->
                  YES
              </label>
              <label>
                  <input type="checkbox" name="checkbox" value="YESSSSS"> <!-- Updated checkbox values for actual answers -->
                  YESSSSS
              </label>
              <label>
                  <input type="checkbox" name="checkbox" value="YES NA YES"> <!-- Updated checkbox values for actual answers -->
                  YES NA YES
              </label>
              <label>
                <input type="checkbox" name="checkbox" value="SOBRA PA SA SOBRA"> <!-- Updated checkbox values for actual answers -->
                SOBRA PA SA SOBRA
            </label>
          </div>
              <label for="bio">Ano masasabi mo sa'kin?
                <textarea id="bio" name="bio" rows="3" cols="30" placeholder="ano ano ano..."></textarea>
              </label>

              <button type="submit" id="submit">Submit</button>
          </form>
    </div>
    <div id="saved-data" style="margin-top: 20px;"></div>

    <script>
            document.getElementById("survey-form").addEventListener("submit", async function(event) 
            {
                event.preventDefault(); // Stop the page from reloading

                // Collect form data
                const name = document.getElementById("name").value;
                const apelyido = document.getElementById("apelyido").value;
                const taon = document.getElementById("taon").value; // 'Edad' in your sheet
                const crush = document.querySelector('input[name="preference"]:checked')?.value; // 'CrushMoBaAko' in your sheet
                const checkboxes = Array.from(document.querySelectorAll('input[name="checkbox"]:checked')).map(checkbox => checkbox.value);
                const fileInput = document.getElementById("profile-picture");
                const file = fileInput.files[0]; // Get the first file if any is selected
                const fileUrl = file ? file.name : "No file uploaded"; // Store file name or indicate no file uploaded
                const bio = document.getElementById("bio").value; // 'Comment' in your sheet
                
                // Prepare the form data for Google Sheets
                const formData =
                {
                    name,       // Corresponds to 'Name' column
                    apelyido,   // Corresponds to 'Apelyido' column
                    taon,       // Corresponds to 'Edad' column
                    crush,      // Corresponds to 'CrushMoBaAko' column
                    checkboxes, // New field for "Miss mo na ba ako??" responses
                    fileUrl,    // New field for the file reference
                    bio         // Corresponds to 'Comment' column
                };

                // Send to Google Sheets
                try 
                {
                    await fetch("https://script.google.com/macros/s/AKfycbz3gATHbu47l7VqtEkmHHXnB2VxQ5SkS8eUiyacZGxf21JWCRQx1mPKz4qBm0f1HOaAQg/exec", {
                    method: "POST",
                    body: JSON.stringify(formData) // Send the data as a JSON object
                });
                alert("YAY!!");
                } catch (error) {
                console.error("Error sending to Google Sheets:", error);
                alert("Aww, error :<");
                }
            });
    </script>   
  </body>
</html>
